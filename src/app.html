<!doctype html>
<html lang="zh-CN">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<meta name="theme-color" content="#ad5030" />
		<script>
			try {
				const p = JSON.parse(localStorage.getItem('ecse2100-fieldnotes-v1') || '{}');
				const dark = p.theme === 'dark' || ((!p.theme || p.theme === 'system') && matchMedia('(prefers-color-scheme: dark)').matches);
				document.documentElement.classList.toggle('dark', dark);
				document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
				if (p.locale === 'en') document.documentElement.lang = 'en';
				document.documentElement.dataset.navigation = p.sidebars?.navigation === false ? 'closed' : 'open';
				document.documentElement.dataset.references = p.sidebars?.references === false ? 'closed' : 'open';
			} catch {}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
